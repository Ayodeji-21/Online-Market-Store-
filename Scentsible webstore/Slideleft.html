<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwipeLeft Animation - Scensible</title>
<style>
  body{
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
  }

  /* THE DIV TO ANIMATE */
  .card{
    width: 300px;
    height: 200px;
    background: #d6bba8; /* Scensible champagne color */
    color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;

    /* Animation properties */
    animation-name: swipeLeft;
    animation-duration: 1s;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }

  /* KEYFRAMES: swipeLeft */
  @keyframes swipeLeft {
    0% {
      opacity: 0;              /* Start invisible */
      transform: translateX(100%); /* Start 100% to the right of its position */
    }
    100% {
      opacity: 1;              /* End fully visible */
      transform: translateX(0);    /* End at normal position */
    }
  }
</style>
</head>
<body>

  <div class="card">
    New Arrival 🔥
  </div>

</body>
</html>
